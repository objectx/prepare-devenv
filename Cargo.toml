[package]
name = "prepare-devenv"
version = "0.1.1"
edition = "2024"
description = "Bridge Visual Studio's developer environment into other shells"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows = { version = "0.62", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[dev-dependencies]
anyhow = "1.0"
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[features]
test_hooks = []
live = []

[profile.dist]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
